<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeu musical 🎵</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f7f7f7;
    }

    h1 {
      margin-bottom: 10px;
    }

    #reader {
      max-width: 500px;
      margin: 20px auto;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h1>🎵 Jeu musical</h1>
  <p>Scanne le QR code de la chanson</p>

  <div id="reader"></div>

  <div id="result"></div>

  <script>
    function onScanSuccess(decodedText) {
  try {
    const url = new URL(decodedText);

    // On transforme automatiquement le lien Apple Music
    // en lien d'intégration.
    if (url.hostname === "music.apple.com") {
      url.hostname = "embed.music.apple.com";
    }

    const embedUrl = url.toString();

    document.getElementById("result").innerHTML = `
      <h2>🎵 Écoute l'extrait</h2>
      <iframe
        allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write"
        frameborder="0"
        height="175"
        style="width:100%; max-width:660px; overflow:hidden; background:transparent;"
        sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-top-navigation-by-user-activation"
        src="${embedUrl}">
      </iframe>
    `;

  } catch (error) {
    document.getElementById("result").innerHTML =
      "Impossible de lire ce QR code.";
  }
}

    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: { width: 250, height: 250 }
      },
      false
    );

    scanner.render(onScanSuccess);
  </script>

</body>
</html>
